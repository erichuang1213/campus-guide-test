<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生活圈管理｜校邊好去處</title><link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><style>
:root{--ink:#1f2933;--muted:#667085;--paper:#fffdf8;--line:#e8e2d7;--brand:#176b5b;--soft:#f7f4ec}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 ui-sans-serif,system-ui,"Noto Sans TC",Arial,sans-serif}.shell{max-width:1080px;margin:auto;padding:0 28px}nav{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:20px;font-weight:800}.logo b,a{color:var(--brand)}a{font-weight:700;text-decoration:none}.head{padding:38px 0 20px}.head h1{font-size:32px;letter-spacing:-1px;margin:0}.head p{color:var(--muted);margin:5px 0 0}.layout{display:grid;grid-template-columns:1.4fr .6fr;gap:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.map{height:460px;border-radius:11px;overflow:hidden}.panel h2{font-size:19px;margin:0 0 7px}.panel p{color:var(--muted);margin:0 0 16px}label{display:grid;gap:6px;font-weight:700;margin-bottom:12px}input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px}.primary,.secondary{font:inherit;border-radius:8px;padding:10px 13px;cursor:pointer}.primary{border:0;background:var(--brand);color:#fff;font-weight:800}.secondary{border:1px solid var(--line);background:#fff;color:var(--brand);font-weight:700}.status{min-height:20px;color:var(--brand);font-size:13px;margin-top:12px}.list{display:grid;gap:9px;margin-top:18px}.region{padding:12px;border:1px solid var(--line);border-radius:10px}.region strong{display:block}.region small{color:var(--muted)}.region button{margin-top:8px;margin-right:7px}.empty{color:var(--muted);padding:14px 0}@media(max-width:760px){.shell{padding:0 18px}.layout{grid-template-columns:1fr}.map{height:360px}}
</style></head><body><nav class="shell"><div class="logo">校邊<b>好去處</b></div><a href="admin.html">← 回管理後台</a></nav><main class="shell"><section class="head"><h1>生活圈管理</h1><p>移動與縮放地圖到想服務的範圍，再將目前畫面儲存成生活圈。</p></section><div class="layout"><section class="panel"><div id="map" class="map"></div></section><section class="panel"><h2>建立生活圈</h2><p>建議以步行 10–15 分鐘可涵蓋的商圈、車站或街區為一個單位。</p><label>生活圈名稱<input id="name" placeholder="例如：台北車站生活圈"></label><button class="primary" id="save">儲存目前地圖範圍</button><div class="status" id="status"></div><h2 style="margin-top:25px">已儲存的生活圈</h2><div id="list" class="list"></div></section></div></main><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script>
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[120.96,23.7],zoom:6.7});map.addControl(new maplibregl.NavigationControl({showCompass:false}));let regions=JSON.parse(localStorage.getItem('campusGuideRegions')||'[]'),boxes=[];function draw(){boxes.forEach(x=>x.remove());boxes=[];regions.forEach(r=>{const el=document.createElement('div');el.style.cssText='width:18px;height:18px;border:3px solid #176b5b;border-radius:50%;background:#fff';boxes.push(new maplibregl.Marker({element:el}).setLngLat([(r.west+r.east)/2,(r.south+r.north)/2]).setPopup(new maplibregl.Popup().setText(r.name)).addTo(map))});const list=document.getElementById('list');list.innerHTML=regions.length?regions.map((r,i)=>`<article class="region"><strong>${r.name}</strong><small>已儲存範圍・${r.createdAt}</small><br><button class="secondary" data-view="${i}">查看</button><button class="secondary" data-delete="${i}">刪除</button></article>`).join(''):'<div class="empty">尚未建立生活圈。</div>';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const r=regions[+b.dataset.view];map.fitBounds([[r.west,r.south],[r.east,r.north]],{padding:40})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{regions.splice(+b.dataset.delete,1);localStorage.setItem('campusGuideRegions',JSON.stringify(regions));draw()})}document.getElementById('save').onclick=()=>{const name=document.getElementById('name').value.trim();if(!name){document.getElementById('status').textContent='請先輸入生活圈名稱。';return}const b=map.getBounds();regions.push({name,west:b.getWest(),east:b.getEast(),south:b.getSouth(),north:b.getNorth(),createdAt:new Date().toLocaleDateString('zh-TW')});localStorage.setItem('campusGuideRegions',JSON.stringify(regions));document.getElementById('name').value='';document.getElementById('status').textContent=`已儲存「${name}」。`;draw()};draw();
const locateBtn=document.createElement('button'),drawBtn=document.createElement('button');locateBtn.className=drawBtn.className='secondary';locateBtn.textContent='定位目前位置';drawBtn.textContent='開始繪製範圍';const saveBtn=document.getElementById('save');saveBtn.before(locateBtn,drawBtn,document.createElement('br'),document.createElement('br'));locateBtn.onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:15});new maplibregl.Marker({color:'#176b5b'}).setLngLat([p.coords.longitude,p.coords.latitude]).addTo(map)},()=>document.getElementById('status').textContent='無法取得位置，請確認瀏覽器權限。');let drawing=false,points=[];map.on('load',()=>{map.addSource('sketch',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'sketch-fill',type:'fill',source:'sketch',paint:{'fill-color':'#176b5b','fill-opacity':.15}});map.addLayer({id:'sketch-line',type:'line',source:'sketch',paint:{'line-color':'#176b5b','line-width':3}})});function preview(){if(!map.getSource('sketch'))return;const ring=points.length>2?[...points,points[0]]:points;map.getSource('sketch').setData({type:'FeatureCollection',features:ring.length?[{type:'Feature',geometry:{type:points.length>2?'Polygon':'LineString',coordinates:points.length>2?[ring]:ring}}]:[]})}drawBtn.onclick=()=>{drawing=!drawing;points=[];drawBtn.textContent=drawing?'完成繪製':'開始繪製範圍';document.getElementById('status').textContent=drawing?'請在地圖上依序點選至少三個角落。':'';preview()};map.on('click',e=>{if(!drawing)return;points.push([e.lngLat.lng,e.lngLat.lat]);preview()});saveBtn.onclick=()=>{const name=document.getElementById('name').value.trim();if(!name){document.getElementById('status').textContent='請先輸入生活圈名稱。';return}if(points.length<3){document.getElementById('status').textContent='請先繪製至少三個角落。';return}const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);regions.push({name,polygon:points,west:Math.min(...xs),east:Math.max(...xs),south:Math.min(...ys),north:Math.max(...ys),createdAt:new Date().toLocaleDateString('zh-TW')});localStorage.setItem('campusGuideRegions',JSON.stringify(regions));document.getElementById('name').value='';drawing=false;drawBtn.textContent='開始繪製範圍';points=[];preview();document.getElementById('status').textContent=`已儲存「${name}」。`;draw()};
function ensureSketch(){if(map.getSource('sketch'))return;map.addSource('sketch',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'sketch-fill',type:'fill',source:'sketch',paint:{'fill-color':'#176b5b','fill-opacity':.15}});map.addLayer({id:'sketch-line',type:'line',source:'sketch',paint:{'line-color':'#176b5b','line-width':3}})}function renderRegions(){if(!map.getSource('region-shapes')){map.addSource('region-shapes',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'region-fill',type:'fill',source:'region-shapes',paint:{'fill-color':'#176b5b','fill-opacity':.12}});map.addLayer({id:'region-line',type:'line',source:'region-shapes',paint:{'line-color':'#176b5b','line-width':3}})}const features=regions.map(r=>{const ring=r.polygon?[...r.polygon,r.polygon[0]]:[[r.west,r.south],[r.east,r.south],[r.east,r.north],[r.west,r.north],[r.west,r.south]];return{type:'Feature',properties:{name:r.name},geometry:{type:'Polygon',coordinates:[ring]}}});map.getSource('region-shapes').setData({type:'FeatureCollection',features})}preview=function(){ensureSketch();const ring=points.length>2?[...points,points[0]]:points;map.getSource('sketch').setData({type:'FeatureCollection',features:ring.length?[{type:'Feature',geometry:{type:points.length>2?'Polygon':'LineString',coordinates:points.length>2?[ring]:ring}}]:[]})};drawBtn.textContent='開始繪製範圍';drawBtn.onclick=()=>{if(!drawing){drawing=true;points=[];drawBtn.textContent='完成繪製';document.getElementById('status').textContent='請在地圖上依序點選至少三個角落。'}else{drawing=false;drawBtn.textContent='重新繪製範圍';document.getElementById('status').textContent=points.length>=3?'範圍已完成，請輸入名稱後儲存。':'至少需要三個角落。';preview()}};saveBtn.textContent='儲存繪製的生活圈';saveBtn.onclick=()=>{const name=document.getElementById('name').value.trim();if(!name){document.getElementById('status').textContent='請先輸入生活圈名稱。';return}if(points.length<3){document.getElementById('status').textContent='請先繪製至少三個角落。';return}const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);regions.push({name,polygon:[...points],west:Math.min(...xs),east:Math.max(...xs),south:Math.min(...ys),north:Math.max(...ys),createdAt:new Date().toLocaleDateString('zh-TW')});localStorage.setItem('campusGuideRegions',JSON.stringify(regions));document.getElementById('name').value='';points=[];preview();draw();renderRegions();document.getElementById('status').textContent=`已儲存「${name}」。`};if(map.loaded()){ensureSketch();renderRegions()}else map.once('load',()=>{ensureSketch();renderRegions()});
</script><script>
// 已儲存的生活圈以多邊形呈現；不再以中心小圓圈代表範圍。
const drawListAndShapes = draw;
draw = function () {
  drawListAndShapes();
  boxes.forEach(marker => marker.remove());
  boxes = [];
  if (map.loaded()) renderRegions();
};
if (map.loaded()) draw();
</script><script>
// 定位只負責把地圖移到使用者附近，不再留下會和生活圈混淆的圓點。
locateBtn.onclick = () => navigator.geolocation?.getCurrentPosition(
  position => map.flyTo({ center: [position.coords.longitude, position.coords.latitude], zoom: 15 }),
  () => document.getElementById('status').textContent = '無法取得位置，請確認瀏覽器權限。'
);

// 每個生活圈都能進入候選店家流程；實際公開前仍須逐筆審核。
const previousDraw = draw;
draw = function () {
  previousDraw();
  document.querySelectorAll('.region').forEach((card, index) => {
    const explore = document.createElement('button');
    explore.className = 'secondary';
    explore.textContent = '探索並匯入店家';
    explore.onclick = () => { window.location.href = `candidates.html?region=${index}`; };
    card.appendChild(explore);
  });
};
draw();
</script></body></html>
