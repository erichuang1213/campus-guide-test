 1fr auto;gap:8px;align-items:end}.time-slot label{font-weight:500}.remove-slot{border:0;background:none;color:var(--danger);padding:9px 2px;font-size:13px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag-check{display:flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-weight:400}.tag-check input{width:auto;margin:0}.picker-help{color:var(--muted);font-weight:400;font-size:12px}.picker{height:235px;border:1px solid var(--line);border-radius:9px;overflow:hidden}.form-actions{display:flex;gap:10px;margin-top:18px}.primary{border:0;border-radius:8px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:800}.status{font-size:13px;color:var(--brand);margin:12px 0 0;min-height:20px}.utilities{display:flex;gap:12px;margin-top:22px}.utilities button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline}.empty{color:var(--muted);padding:18px 0}@media(max-width:760px){.shell{padding:0 18px}.layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.nav-text{display:none}}

<body>
<nav class="shell"><div class="logo">校邊<b>好去處</b></div><a href="index.html">← 回到網站首頁</a></nav>
<main class="shell"><section class="intro"><div class="kicker">內容管理後台</div><h1>維護學生真正會用到的資訊</h1><p>新增店家、標籤、菜單與地圖座標。這些設定只儲存在目前瀏覽器，適合先做內容驗證；正式上線時再改接資料庫與帳號權限。</p></section><div class="notice">目前是本機草案模式：你按下儲存後，首頁重新整理就會讀取新資料。</div><section class="panel" style="margin-bottom:24px"><h2>CSV 批次匯入</h2><p class="sub">欄位：name, category, price, lat, lng, tags, periods, days, desc, menu, image。時段：<code>11:00-14:00|17:00-21:00</code>；標籤以 <code>|</code> 分隔。</p><input id="csvFile" type="file" accept=".csv,text/csv"><div class="form-actions"><button class="primary" type="button" id="importCsv">匯入店家</button><button class="secondary" type="button" id="downloadTemplate">下載範例 CSV</button></div><div class="status" id="importStatus"></div></section>
<div class="layout"><section class="panel"><h2>已建立的店家</h2><p class="sub" id="count"></p><div class="list" id="list"></div><div class="utilities"><button id="reset">還原示範資料</button><button id="clear">清空所有資料</button></div></section>
<section class="panel"><h2 id="formTitle">新增店家</h2><p class="sub">帶有 * 的欄位建議優先填寫。</p><form id="form"><input type="hidden" id="editIndex"><div class="form-grid"><label>店家名稱 *<input id="name" required placeholder="例如：巷口麵食館"></label><label>類型／主打 *<input id="category" required placeholder="例如：牛肉麵、乾麵"></label><div class="full"><label>營業日</label><div class="tags" id="dayChoices"></div></div><div class="full"><label>營業時段 <span class="picker-help">可新增午、晚餐等多個時段。</span></label><div class="time-slots" id="timeSlots"></div><button class="secondary" type="button" id="addPeriod">＋ 新增營業時段</button></div><label>價位<input id="price" placeholder="例如：$100–180"></label><label>菜單網址<input id="menu" type="url" placeholder="https://..."></label><label>店家封面圖片網址<input id="image" type="url" placeholder="https://..."></label><label>或上傳圖片<input id="imageFile" type="file" accept="image/*"></label><label>緯度（Latitude）<input id="lat" type="number" step="any" placeholder="例如：25.0330"></label><label>經度（Longitude）<input id="lng" type="number" step="any" placeholder="例如：121.5654"></label><div class="full"><label>在地圖上選擇店家位置 <span class="picker-help">拖曳、縮放後點選店家，座標會自動填入。</span></label><div class="picker" id="pickerMap"></div></div><label class="full">學生提醒／店家介紹<textarea id="desc" placeholder="例如：二樓有插座；12:00–12:40 人潮較多。"></textarea></label><div class="full"><label>標籤</label><div class="tags" id="tagChoices"></div><div class="form-actions"><input id="customTag" placeholder="新增自訂標籤，例如：適合聚餐"><button class="secondary" type="button" id="addTag">新增標籤</button></div></div></div><div class="form-actions"><button class="primary" type="submit">儲存店家</button><button class="secondary" type="button" id="cancel">取消編輯</button></div><div class="status" id="status" aria-live="polite"></div></form></section></div></main>

<script>
const defaultTags=['麵','飯','早餐','咖啡','甜點','素食','吃正餐','讀書','可內用','外帶','可訂位','有插座','Wi‑Fi','可久坐','平價','快速出餐','晚間','深夜','寵物友善'];let customTags=JSON.parse(localStorage.getItem('campusGuideCustomTags')||'[]');let tags=[...defaultTags,...customTags];
const seed=[{name:'巷口麵食館',icon:'🍜',tone:'tone-1',distance:'步行 3 分鐘',hours:'營業至 20:30',price:'$90–160',tags:['麵','吃正餐','可內用','平價'],desc:'牛肉麵、乾麵與水餃。中午快但 12:10–12:40 常需要等位。',updated:'2 天前'},{name:'森日咖啡',icon:'☕',tone:'tone-2',distance:'步行 5 分鐘',hours:'營業至 21:00',price:'$100–190',tags:['咖啡','讀書','有插座','可內用'],desc:'二樓安靜、有 Wi‑Fi 和多數座位插座；平日午後適合讀書。',updated:'昨天'},{name:'小碗日食',icon:'🍱',tone:'tone-3',distance:'步行 7 分鐘',hours:'營業至 19:30',price:'$120–190',tags:['飯','吃正餐','可內用','平價'],desc:'定食份量足，一人吃也自在；每日 14:00–17:00 休息。',updated:'4 天前'},{name:'晚安拉麵',icon:'🍥',tone:'tone-4',distance:'步行 9 分鐘',hours:'營業至 23:00',price:'$180–250',tags:['麵','吃正餐','晚間','可內用'],desc:'適合晚上下課後吃的濃郁拉麵；可先線上取號。',updated:'今天'},{name:'日光甜點室',icon:'🍰',tone:'tone-5',distance:'步行 10 分鐘',hours:'營業至 18:00',price:'$110–220',tags:['甜點','咖啡','可內用','讀書'],desc:'採光好、甜點每日更換；週末人多，不建議長時間讀書。',updated:'3 天前'},{name:'阿伯便當',icon:'🥡',tone:'tone-6',distance:'步行 4 分鐘',hours:'營業至 14:00',price:'$75–105',tags:['飯','外帶','平價','吃正餐'],desc:'快速、便宜的午餐選擇。主要外帶，建議 11:30 前到。',updated:'1 週前'}];
let places=JSON.parse(localStorage.getItem('campusGuidePlaces')||'null')||seed;const $=id=>document.getElementById(id);const weekdays=['日','一','二','三','四','五','六'];function renderDays(selected=[0,1,2,3,4,5,6]){$('dayChoices').innerHTML=weekdays.map((d,i)=>`<label class="tag-check"><input type="checkbox" value="${i}" ${selected.includes(i)?'checked':''}>週${d}</label>`).join('')}renderDays();function renderTagChoices(selected=[]){$('tagChoices').innerHTML=tags.map(t=>`<label class="tag-check"><input type="checkbox" value="${t}" ${selected.includes(t)?'checked':''}>${t}</label>`).join('')}renderTagChoices();$('addTag').onclick=()=>{const tag=$('customTag').value.trim();if(!tag)return;if(tags.includes(tag)){$('status').textContent='這個標籤已經存在。';return}const selected=[...document.querySelectorAll('#tagChoices input:checked')].map(x=>x.value);customTags.push(tag);tags.push(tag);localStorage.setItem('campusGuideCustomTags',JSON.stringify(customTags));renderTagChoices([...selected,tag]);$('customTag').value='';$('status').textContent=`已新增「${tag}」，記得勾選後儲存店家。`};let periods=[{open:'',close:''}],pendingImage='';$('imageFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{pendingImage=reader.result;$('status').textContent='圖片已載入，儲存店家後會顯示。'};reader.readAsDataURL(file)};const timeValues=Array.from({length:48},(_,i)=>`${String(Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`);function timeOptions(value){return `<option value="">選擇時間</option>${timeValues.map(t=>`<option value="${t}" ${t===value?'selected':''}>${t}</option>`).join('')}`}function renderTimeSlots(next=periods){periods=next.length?next:[{open:'',close:''}];$('timeSlots').innerHTML=periods.map((p,i)=>`<div class="time-slot"><label>開始<select class="period-open" data-index="${i}">${timeOptions(p.open||'')}</select></label><label>結束<select class="period-close" data-index="${i}">${timeOptions(p.close||'')}</select></label>${periods.length>1?`<button class="remove-slot" type="button" data-remove="${i}">移除此時段</button>`:'<span></span>'}</div>`).join('');document.querySelectorAll('.period-open').forEach(x=>x.onchange=()=>periods[+x.dataset.index].open=x.value);document.querySelectorAll('.period-close').forEach(x=>x.onchange=()=>periods[+x.dataset.index].close=x.value);document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>renderTimeSlots(periods.filter((_,i)=>i!==+x.dataset.remove)))}$('addPeriod').onclick=()=>renderTimeSlots([...periods,{open:'',close:''}]);renderTimeSlots();let picker,pickerMarker;function setPicker(lng,lat){$('lng').value=lng.toFixed(6);$('lat').value=lat.toFixed(6);if(pickerMarker)pickerMarker.remove();pickerMarker=new maplibregl.Marker({color:'#176b5b'}).setLngLat([lng,lat]).addTo(picker)}function initPicker(){picker=new maplibregl.Map({container:'pickerMap',style:'https://tiles.openfreemap.org/styles/liberty',center:[120.96,23.7],zoom:6.7});picker.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');picker.on('click',e=>setPicker(e.lngLat.lng,e.lngLat.lat));}
function save(){localStorage.setItem('campusGuidePlaces',JSON.stringify(places));renderList()}function renderList(){$('count').textContent=`共 ${places.length} 間店家；首頁會依此清單顯示。`;$('list').innerHTML=places.length?places.map((p,i)=>`<div class="row"><div><strong>${p.icon||'📍'} ${p.name}</strong><small>${p.tags.join('・')||'尚未設定標籤'}${Number.isFinite(p.lat)?'・已設定地圖座標':''}</small></div><div class="row-actions"><button class="secondary" data-edit="${i}">編輯</button><button class="delete" data-delete="${i}">刪除</button></div></div>`).join(''):'<div class="empty">還沒有店家。從右側表單新增第一間吧。</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(+b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm(`刪除「${places[+b.dataset.delete].name}」？`)){places.splice(+b.dataset.delete,1);save()}})}
function clearForm(){$('form').reset();pendingImage='';$('editIndex').value='';$('formTitle').textContent='新增店家';$('status').textContent='';renderTagChoices();renderDays();renderTimeSlots();if(pickerMarker){pickerMarker.remove();pickerMarker=null}}function edit(i){const p=places[i];$('formTitle').textContent=`編輯：${p.name}`;$('editIndex').value=i;['name','price','desc','lat','lng','image'].forEach(k=>$(k).value=p[k]??'');pendingImage='';const oldTimes=(p.hours||'').match(/(\d{1,2}:\d{2})/g)||[],isCloseOnly=(p.hours||'').includes('至');const oldPeriods=p.periods?.length?p.periods:[{open:p.openTime||(isCloseOnly?'':oldTimes[0]||''),close:p.closeTime||(isCloseOnly?oldTimes[0]||'':oldTimes[1]||'')}];renderTimeSlots(oldPeriods);renderDays(p.days||[0,1,2,3,4,5,6]);$('category').value=(p.tags||[]).filter(t=>['麵','飯','早餐','咖啡','甜點','素食'].includes(t)).join('、')||'';$('menu').value=p.menu||'';renderTagChoices(p.tags||[]);if(Number.isFinite(p.lat)&&Number.isFinite(p.lng)){picker.flyTo({center:[p.lng,p.lat],zoom:16});setPicker(p.lng,p.lat)}window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
$('form').onsubmit=e=>{e.preventDefault();const selected=[...document.querySelectorAll('#tagChoices input:checked')].map(x=>x.value);const days=[...document.querySelectorAll('#dayChoices input:checked')].map(x=>Number(x.value));const category=$('category').value.trim().split(/[、，,\s]+/).filter(Boolean);category.forEach(t=>{if(!selected.includes(t))selected.unshift(t)});const idx=$('editIndex').value;const old=idx===''?{}:places[+idx];const savedPeriods=periods.filter(p=>p.open||p.close);const hours=savedPeriods.length?savedPeriods.map(p=>p.open&&p.close?`${p.open}–${p.close}`:p.open?`自 ${p.open}`:`至 ${p.close}`).join('、'):'營業時間待確認';const p={...old,name:$('name').value.trim(),icon:old.icon||'📍',tone:old.tone||'tone-1',hours,periods:savedPeriods,days,image:pendingImage||$('image').value.trim()||old.image||'',price:$('price').value.trim()||'價位待確認',menu:$('menu').value.trim(),lat:$('lat').value===''?undefined:Number($('lat').value),lng:$('lng').value===''?undefined:Number($('lng').value),tags:selected,desc:$('desc').value.trim()||'尚未補充學生提醒。',updated:'剛剛'};if(idx==='')places.unshift(p);else places[+idx]=p;save();clearForm();$('status').textContent='已儲存。回到首頁重新整理，即可看到更新。'};$('cancel').onclick=clearForm;$('reset').onclick=()=>{if(confirm('還原成示範資料？目前內容將被覆蓋。')){places=seed;save();clearForm()}};$('clear').onclick=()=>{if(confirm('確定清空所有店家？')){places=[];save();clearForm()}};initPicker();renderList();
document.getElementById('downloadTemplate').onclick=()=>{const csv='name,category,price,lat,lng,tags,periods,days,desc,menu,image\n示範麵店,麵,$100-180,25.033,121.565,麵|吃正餐|可內用,11:00-14:00|17:00-21:00,1|2|3|4|5,午休後才有晚餐時段,https://example.com/menu.jpg,https://example.com/shop.jpg';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='campus-guide-template.csv';a.click()};document.getElementById('importCsv').onclick=()=>{const file=document.getElementById('csvFile').files[0],note=document.getElementById('importStatus');if(!file){note.textContent='請先選擇 CSV 檔案。';return}const reader=new FileReader();reader.onload=()=>{const lines=String(reader.result).trim().split(/\r?\n/),headers=lines.shift().split(',').map(x=>x.trim());let added=0;lines.forEach(line=>{const row=line.split(',');const v=k=>row[headers.indexOf(k)]?.trim()||'';if(!v('name'))return;const periods=v('periods').split('|').filter(Boolean).map(x=>{const [open,close]=x.split('-');return{open,close}});places.unshift({name:v('name'),icon:'📍',tone:'tone-1',price:v('price')||'價位待確認',lat:Number(v('lat')),lng:Number(v('lng')),tags:v('tags').split('|').filter(Boolean),periods,hours:periods.map(x=>`${x.open}–${x.close}`).join('、')||'營業時間待確認',days:v('days').split('|').filter(Boolean).map(Number),desc:v('desc')||'尚未補充學生提醒。',menu:v('menu'),image:v('image'),updated:'剛剛'});added++});save();note.textContent=`已匯入 ${added} 間店家。`};reader.readAsText(file)};
</script><script>
// Google Maps Takeout 的「Saved」CSV 匯入：保留原始線索，先送往待審核區，不直接公開。
const standardCsvPanel = document.getElementById('csvFile').closest('.panel');
const mapsImportPanel = document.createElement('section');
mapsImportPanel.className = 'panel';
mapsImportPanel.style.marginBottom = '24px';
mapsImportPanel.innerHTML = `
  <h2>Google Maps 已儲存清單匯入</h2>
  <p class="sub">從 Google Takeout 匯出的 <strong>Saved</strong> CSV 可直接選取。系統會讀取店名、地址與 Google 地圖連結，並先放入待審核店家，不會直接出現在首頁。</p>
  <input id="mapsSavedCsv" type="file" accept=".csv,text/csv">
  <div class="form-actions"><button class="primary" type="button" id="importMapsSaved">匯入為待審核店家</button><a class="secondary" href="candidates.html">查看待審核店家</a></div>
  <div class="status" id="mapsImportStatus"></div>`;
standardCsvPanel.after(mapsImportPanel);

function parseCsv(text) {
  const firstLine = text.split(/\r?\n/, 1)[0] || '';
  const delimiter = firstLine.includes('\t') ? '\t' : (firstLine.split(';').length > firstLine.split(',').length ? ';' : ',');
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const char = text[i], next = text[i + 1];
    if (char === '"' && quoted && next === '"') { cell += '"'; i++; }
    else if (char === '"') quoted = !quoted;
    else if (char === delimiter && !quoted) { row.push(cell); cell = ''; }
    else if ((char === '\n' || char === '\r') && !quoted) {
      if (char === '\r' && next === '\n') i++;
      row.push(cell); if (row.some(value => value.trim())) rows.push(row); row = []; cell = '';
    } else cell += char;
  }
  row.push(cell); if (row.some(value => value.trim())) rows.push(row);
  return rows;
}
function valueFrom(row, headers, names) {
  const index = headers.findIndex(header => names.includes(header) || names.some(name => header.includes(name)));
  return index < 0 ? '' : (row[index] || '').trim();
}
function coordinatesFromUrl(url) {
  const match = String(url).match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  return match ? { lat: Number(match[1]), lng: Number(match[2]) } : {};
}
document.getElementById('importMapsSaved').onclick = () => {
  const file = document.getElementById('mapsSavedCsv').files[0];
  const note = document.getElementById('mapsImportStatus');
  if (!file) { note.textContent = '請先選擇從 Google Takeout 下載並解壓縮後的 CSV。'; return; }
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result).replace(/^\uFEFF/, ''));
    if (rows.length < 2) { note.textContent = '找不到可匯入的店家資料。請確認選的是 Saved 清單的 CSV。'; return; }
    const headers = rows.shift().map(header => header.trim().toLowerCase());
    const candidates = JSON.parse(localStorage.getItem('campusGuideCandidates') || '[]');
    const known = new Set([...places, ...candidates].map(place => `${place.name || ''}|${place.address || ''}`.toLowerCase()));
    let added = 0, skipped = 0;
    rows.forEach((row, index) => {
      const googleMapsUri = valueFrom(row, headers, ['url', 'google maps url', 'maps url', 'link', '網址', '連結']);
      const name = valueFrom(row, headers, ['title', 'name', 'place name', 'place', '名稱', '店家名稱', '地點名稱']) || row.find(value => value.trim() && !/^https?:\/\//i.test(value.trim()))?.trim() || '';
      const address = valueFrom(row, headers, ['address', 'formatted address', 'location', '地址', '地點', 'vicinity']);
      if (!name) { skipped++; return; }
      const key = `${name}|${address}`.toLowerCase();
      if (known.has(key)) { skipped++; return; }
      known.add(key);
      candidates.unshift({ id: `saved-${Date.now()}-${index}`, name, category: '待分類', address: address || '地址待確認', googleMapsUri, ...coordinatesFromUrl(googleMapsUri), source: 'Google Maps 已儲存清單' });
      added++;

  const open = document.getElementById('overrideOpen').value, close = document.getElementById('overrideClose').value;
  if (!days.length || !open || !close) { document.getElementById('status').textContent = '請勾選適用的星期，並填寫開始與結束時間。'; return; }
  weeklyOverrides.push({ days, open, close });
  document.querySelectorAll('#overrideDays input').forEach(input => input.checked = false);
  document.getElementById('overrideOpen').value = ''; document.getElementById('overrideClose').value = '';
  const persisted = persistWeeklyOverrides();
  if (!persisted) document.getElementById('status').textContent = '特殊時段已加入；新增店家請再按最下方的「儲存店家」。';
  renderWeeklyOverrides();
};
const submitWithWeeklyOverrides = document.getElementById('form').onsubmit;
document.getElementById('form').onsubmit = event => {
  const index = document.getElementById('editIndex').value;
  const savedOverrides = weeklyOverrides.map(rule => ({ days: [...rule.days], periods: [{ open: rule.open, close: rule.close }] }));
  submitWithWeeklyOverrides(event);
  const target = index === '' ? places[0] : places[Number(index)];
  if (target) { target.weeklySchedules = savedOverrides; save(); }
};
const editWithWeeklyOverrides = edit;
edit = index => { editWithWeeklyOverrides(index); weeklyOverrides = (places[index].weeklySchedules || []).flatMap(rule => (rule.periods || []).map(period => ({ days: [...rule.days], open: period.open, close: period.close }))); renderWeeklyOverrides(); };
const clearWithWeeklyOverrides = clearForm;
clearForm = () => { clearWithWeeklyOverrides(); weeklyOverrides = []; renderWeeklyOverrides(); };
renderWeeklyOverrides();
const publishPanel = document.createElement('section');
publishPanel.className = 'panel';
publishPanel.style.marginBottom = '24px';
publishPanel.innerHTML = '<h2>發佈測試資料</h2><p class="sub">將目前瀏覽器內的店家資料匯出成 JSON，提供給開發者更新公開測試網站。檔案不包含 API 金鑰。</p><div class="form-actions"><button class="primary" type="button" id="exportPublishData">下載公開資料 JSON</button></div><div class="status" id="exportPublishStatus"></div>';
document.querySelector('.layout').before(publishPanel);
document.getElementById('exportPublishData').onclick = () => {
  const snapshot = { exportedAt: new Date().toISOString(), places: JSON.parse(localStorage.getItem('campusGuidePlaces') || '[]'), customTags: JSON.parse(localStorage.getItem('campusGuideCustomTags') || '[]') };
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' }));
  link.download = 'campus-guide-public-data.json'; link.click(); URL.revokeObjectURL(link.href);
  document.getElementById('exportPublishStatus').textContent = '已下載。請把 campus-guide-public-data.json 傳給開發者發布。';
};
</script><script src="supabase-config.js"></script><script type="module" src="backend.js"></script><script type="module">
// 雲端管理模式：未登入者不能操作；登入後店家資料會與公開首頁共用。
const waitForBackend = async () => {
  for (let i = 0; i < 50 && !window.CampusBackend; i++) await new Promise(resolve => setTimeout(resolve, 50));
  return window.CampusBackend;
};
const backend = await waitForBackend();
const gate = document.createElement('div');
gate.style.cssText = 'position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:#fffdf8';
const panel = document.createElement('section');
panel.style.cssText = 'width:min(430px,100%);padding:28px;background:#fffdf8;border-radius:18px;box-shadow:0 20px 60px #0005';
gate.append(panel); document.body.append(gate);
const message = text => { panel.innerHTML = `<h2 style="margin:0 0 8px">管理後台</h2><p style="color:#667085">${text}</p>`; };
const showLogin = (note = '請使用管理員帳號登入。') => {
  panel.innerHTML = `<h2 style="margin:0 0 8px">管理後台登入</h2><p style="color:#667085">${note}</p><form id="cloudLogin" style="display:grid;gap:12px"><label>電子信箱<input id="cloudEmail" type="email" required style="width:100%;padding:10px;margin-top:4px"></label><label>密碼<input id="cloudPassword" type="password" minlength="6" required style="width:100%;padding:10px;margin-top:4px"></label><button class="primary">登入</button><small id="cloudStatus" style="color:#667085"></small></form>`;
  const submit = async create => {
    const email = document.getElementById('cloudEmail').value.trim(), password = document.getElementById('cloudPassword').value;
    const status = document.getElementById('cloudStatus'); status.textContent = create ? '正在建立帳號…' : '正在登入…';
    try {
      if (create) await backend.signUp(email, password); else await backend.signIn(email, password);
      await backend.claimAdmin(); await startAdmin();
    } catch (error) { status.textContent = error.message || '無法登入，請確認信箱與密碼。'; }
  };
  document.getElementById('cloudLogin').onsubmit = event => { event.preventDefault(); submit(false); };
};
const startAdmin = async () => {
  try {
    if (!await backend.isAdmin()) { showLogin('此帳號沒有管理權限。'); return; }
    const localSave = save;
    let syncing = false;
    save = () => {
      localSave();
      if (!syncing) backend.syncPlaces(places).catch(error => { document.getElementById('status').textContent = `雲端儲存失敗：${error.message}`; });
    };
    const originalAddTag = document.getElementById('addTag').onclick;
    document.getElementById('addTag').onclick = () => { originalAddTag(); backend.saveSettings(customTags).catch(() => {}); };
    let remotePlaces = await backend.getPlaces();
    if (!remotePlaces.length) {
      const snapshot = await fetch('./campus-guide-public-data.json', { cache: 'no-store' }).then(response => response.ok ? response.json() : null);
      remotePlaces = snapshot?.places || places;
      places.splice(0, places.length, ...remotePlaces);
      syncing = true; localSave(); syncing = false;
      await backend.syncPlaces(places);
    } else { places.splice(0, places.length, ...remotePlaces); localSave(); }
    const remoteTags = await backend.getSettings();
    if (remoteTags.length) { customTags = remoteTags; tags = [...defaultTags, ...customTags]; renderTagChoices(); }
    const loginInfo = document.createElement('div');
    loginInfo.className = 'status'; loginInfo.style.marginBottom = '12px';
    loginInfo.innerHTML = `已登入雲端管理後台。所有儲存會同步到公開首頁。 <button type="button" class="secondary" id="cloudLogout">登出</button>`;
    document.querySelector('.layout').before(loginInfo);
    document.getElementById('cloudLogout').onclick = async () => { await backend.signOut(); location.reload(); };
    gate.remove(); document.getElementById('status').textContent = '已連上雲端資料庫。';
  } catch (error) { message(`無法啟用後台：${error.message}`); }
};
if (!backend?.enabled) message('雲端後台設定尚未完成。');
else if (await backend.session()) startAdmin(); else showLogin();
</script></body></html>
