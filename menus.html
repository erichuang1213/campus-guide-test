<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>菜單管理｜校邊好去處</title>
  <style>
    :root{--ink:#1f2933;--muted:#667085;--paper:#fffdf8;--line:#e8e2d7;--brand:#176b5b;--soft:#f3f7f4;--danger:#b93815}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 ui-sans-serif,system-ui,"Noto Sans TC",Arial}.shell{max-width:1040px;margin:auto;padding:0 28px}nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:20px;font-weight:800}.logo b,a{color:var(--brand)}a{font-weight:700;text-decoration:none}.head{padding:40px 0 24px}.head h1{font-size:34px;letter-spacing:-1px;margin:0 0 7px}.head p{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:.82fr 1.18fr;gap:24px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:21px}.panel h2{font-size:19px;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 16px;font-size:14px}.list{display:grid;gap:9px}.store{width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;cursor:pointer;font:inherit}.store:hover,.store.active{border-color:var(--brand);background:var(--soft)}.store strong{display:block}.store small{color:var(--muted)}label{display:grid;gap:7px;font-weight:700}textarea{font:inherit;min-height:290px;width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;resize:vertical;color:var(--ink)}.hint{font-size:13px;color:var(--muted);margin:9px 0 16px}.actions{display:flex;gap:10px;align-items:center}.primary,.secondary{font:inherit;font-weight:800;border-radius:8px;padding:10px 14px;cursor:pointer}.primary{border:0;background:var(--brand);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--danger)}.status{min-height:22px;color:var(--brand);margin-top:12px;font-size:14px}.empty{padding:25px 0;color:var(--muted)}@media(max-width:760px){.shell{padding:0 18px}.layout{grid-template-columns:1fr}.head{padding-top:28px}}
  </style>
</head>
<body>
  <nav class="shell"><div class="logo">校邊<b>好去處</b> <small>管理後台</small></div><a href="admin.html">← 返回店家管理</a></nav>
  <main class="shell" id="app"><section class="head"><h1>菜單管理</h1><p>以文字整理品項與價格，公開頁只顯示閱讀結果；不使用圖片或外部連結。</p></section><p class="empty">正在確認管理權限…</p></main>
  <script src="supabase-config.js"></script><script type="module" src="backend.js"></script>
  <script type="module">
    const app=document.getElementById('app');
    const wait=async()=>{for(let i=0;i<50&&!window.CampusBackend;i++)await new Promise(resolve=>setTimeout(resolve,50));return window.CampusBackend};
    const escape=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const backend=await wait();
    const login=note=>{
      app.innerHTML=`<section class="head"><h1>菜單管理登入</h1><p>${escape(note||'請使用管理員帳號登入。')}</p></section><form class="panel" id="login" style="max-width:440px;display:grid;gap:13px"><label>電子信箱<input id="email" type="email" required></label><label>密碼<input id="password" type="password" minlength="6" required></label><button class="primary">登入</button><span class="status" id="loginStatus"></span></form>`;
      document.getElementById('login').onsubmit=async event=>{event.preventDefault();try{await backend.signIn(document.getElementById('email').value,document.getElementById('password').value);if(!await backend.isAdmin())throw new Error('此帳號沒有菜單管理權限。');location.reload()}catch(error){document.getElementById('loginStatus').textContent=error.message||'無法登入。'}};
    };
    if(!backend?.enabled){app.innerHTML='<section class="head"><h1>菜單管理</h1><p>雲端後台尚未完成設定。</p></section>'}
    else if(!await backend.session()||!await backend.isAdmin())login();
    else{
      let places=await backend.getPlaces(),selected=0;
      const draw=()=>{
        const place=places[selected];
        app.innerHTML=`<section class="head"><h1>菜單管理</h1><p>以文字整理品項與價格，公開頁只顯示閱讀結果；不使用圖片或外部連結。</p></section><section class="layout"><section class="panel"><h2>選擇店家</h2><p class="sub">共 ${places.length} 間店家</p><div class="list">${places.length?places.map((p,i)=>`<button class="store ${i===selected?'active':''}" data-index="${i}"><strong>${escape(p.name)}</strong><small>${p.menuText?'已有文字菜單':'尚未建立菜單'}</small></button>`).join(''):'<p class="empty">請先到店家管理新增店家。</p>'}</div></section><section class="panel">${place?`<h2>${escape(place.name)} 的菜單</h2><p class="sub">每行一個品項；可寫價格與短說明。空白儲存即移除此店菜單。</p><label>文字菜單<textarea id="menuText" placeholder="例如：\n牛肉麵　$130\n乾麵　$55\n水餃（10 顆）　$70\n燙青菜　$40">${escape(place.menuText||'')}</textarea></label><p class="hint">儲存後會同步到公開店家資訊頁，使用者不能在前台修改。</p><div class="actions"><button class="primary" id="save">儲存菜單</button><button class="secondary" id="remove">移除菜單</button></div><div class="status" id="status"></div>`:'<p class="empty">尚未有可管理的店家。</p>'}</section></section>`;
        document.querySelectorAll('.store').forEach(button=>button.onclick=()=>{selected=Number(button.dataset.index);draw()});
        if(!place)return;
        document.getElementById('save').onclick=async()=>{const button=document.getElementById('save'),status=document.getElementById('status');button.disabled=true;status.textContent='儲存中…';try{place.menuText=document.getElementById('menuText').value.trim();place.menu='';await backend.syncPlaces(places);status.textContent='已儲存並同步到公開網站。';draw()}catch(error){status.textContent=error.message||'儲存失敗。'}finally{button.disabled=false}};
        document.getElementById('remove').onclick=async()=>{if(!confirm('確定移除這間店的文字菜單？'))return;place.menuText='';place.menu='';await backend.syncPlaces(places);draw()};
      };
      draw();
    }
  </script>
</body></html>
