<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>菜單管理｜校邊好去處</title>
  <style>
    :root{--ink:#1b2a28;--muted:#667085;--paper:#fffdf8;--line:#e8e2d7;--brand:#176b5b;--soft:#f3f7f4;--danger:#b93815}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,"Noto Sans TC",sans-serif}.shell{max-width:1100px;margin:auto;padding:0 28px}nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:20px;font-weight:800}.logo b,a{color:var(--brand)}a{font-weight:700;text-decoration:none}.head{padding:40px 0 24px}.head h1{font-size:34px;margin:0 0 7px}.head p,.sub,.hint{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:.8fr 1.2fr;gap:24px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:21px}.panel h2{font-size:19px;margin:0 0 5px}.sub{margin-bottom:16px;font-size:14px}.list{display:grid;gap:9px;max-height:650px;overflow:auto}.store{width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;cursor:pointer;font:inherit}.store.active,.store:hover{border-color:var(--brand);background:var(--soft)}.store strong{display:block}.store small{color:var(--muted)}.upload{display:flex;align-items:center;justify-content:center;min-height:88px;border:1px dashed #9ebfb4;border-radius:12px;background:var(--soft);color:var(--brand);cursor:pointer;text-align:center;padding:14px;font-weight:800}.upload input{display:none}.hint{font-size:13px;margin:10px 0}.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:16px 0}.page{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.page img{display:block;width:100%;height:156px;object-fit:contain;background:#f5f5f2}.page span{display:block;padding:7px 9px;font-size:12px;color:var(--muted)}.remove-one{position:absolute;right:7px;top:7px;border:0;border-radius:999px;background:rgba(33,35,34,.86);color:#fff;width:28px;height:28px;font-size:16px;cursor:pointer}.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary{font:inherit;font-weight:800;border-radius:9px;padding:10px 14px;cursor:pointer}.primary{border:0;background:var(--brand);color:#fff}.primary:disabled{opacity:.6;cursor:wait}.secondary{border:1px solid var(--line);background:#fff;color:var(--danger)}.status{min-height:24px;color:var(--brand);margin-top:12px;font-size:14px}.error{color:var(--danger)}.busy{opacity:.72;pointer-events:none}@media(max-width:760px){.shell{padding:0 18px}.layout{grid-template-columns:1fr}.list{max-height:300px}.preview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <nav class="shell"><div class="logo">校邊<b>好去處</b> <small>管理後台</small></div><a href="admin.html">← 返回店家管理</a></nav>
  <main class="shell" id="app"><section class="head"><h1>菜單管理</h1><p>正在確認管理權限…</p></section></main>
  <script src="supabase-config.js"></script>
  <script type="module" src="backend.js?v=menu-single-place-2"></script>
  <script type="module">
    const app=document.getElementById('app');
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const waitForBackend=async()=>{for(let i=0;i<50&&!window.CampusBackend;i++)await new Promise(resolve=>setTimeout(resolve,50));return window.CampusBackend};
    const backend=await waitForBackend();
    const login=note=>{
      app.innerHTML=`<section class="head"><h1>菜單管理登入</h1><p>${esc(note||'請使用管理員帳號登入。')}</p></section><form class="panel" id="login" style="max-width:440px;display:grid;gap:13px"><label>電子信箱<input id="email" type="email" required></label><label>密碼<input id="password" type="password" required></label><button class="primary">登入</button><span class="status" id="loginStatus"></span></form>`;
      document.getElementById('login').onsubmit=async event=>{event.preventDefault();const out=document.getElementById('loginStatus');try{await backend.signIn(email.value,password.value);if(!await backend.isAdmin())throw Error('此帳號沒有管理權限。');location.reload()}catch(error){out.textContent=error.message||'無法登入。';out.className='status error'}};
    };
    if(!backend?.enabled)login('雲端後台尚未完成設定。');
    else if(!await backend.session()||!await backend.isAdmin())login();
    else {
      let places=await backend.getPlaces();
      let selectedId=places[0]?.id||'';
      let items=[],listScroll=0,saving=false;
      const menuUrls=place=>[...(Array.isArray(place?.menuImages)?place.menuImages:[]),place?.menu].filter(Boolean).filter((url,index,all)=>all.indexOf(url)===index);
      const preview=item=>item.file?item.preview:item.url;
      const activePlace=()=>places.find(place=>place.id===selectedId)||places[0];
      const setStatus=(text,error=false)=>{const box=document.getElementById('status');if(!box)return;box.textContent=text;box.className=error?'status error':'status'};
      const redraw=()=>{
        const box=document.getElementById('previews');if(!box)return;
        box.innerHTML=items.length?items.map((item,index)=>`<div class="page"><img src="${esc(preview(item))}" alt="第 ${index+1} 張菜單"><button class="remove-one" data-remove="${index}" aria-label="移除第 ${index+1} 張菜單">×</button><span>${item.file?'待上傳・':''}第 ${index+1} 張</span></div>`).join(''):'<div class="empty">尚未上傳菜單圖片</div>';
        box.querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>{const removed=items.splice(Number(button.dataset.remove),1)[0];if(removed?.preview)URL.revokeObjectURL(removed.preview);redraw()});
      };
      const render=(notice='')=>{
        listScroll=app.querySelector('.list')?.scrollTop||listScroll;
        if(!places.length){app.innerHTML='<section class="head"><h1>菜單管理</h1><p>目前沒有可管理的店家。</p></section>';return;}
        const place=activePlace();selectedId=place.id;items=menuUrls(place).map(url=>({url}));
        app.innerHTML=`<section class="head"><h1>菜單管理</h1><p>圖片會逐張上傳到雲端檔案空間；此頁只會更新目前選擇的店家。</p></section><section class="layout"><section class="panel"><h2>選擇店家</h2><p class="sub">共 ${places.length} 間店家</p><div class="list">${places.map(store=>`<button class="store ${store.id===selectedId?'active':''}" data-id="${esc(store.id)}"><strong>${esc(store.name)}</strong><small>${menuUrls(store).length?`已有 ${menuUrls(store).length} 張菜單`:'尚未上傳菜單'}</small></button>`).join('')}</div></section><section class="panel" id="editor"><h2>${esc(place.name)} 的菜單</h2><p class="sub">可一次選取多張 JPG、PNG、WebP 圖片；每張限 10 MB，最多 8 張。</p><label class="upload">＋ 選擇菜單圖片（可多選）<input id="menuFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div class="preview-grid" id="previews"></div><p class="hint">新增圖片會先預覽；按「儲存全部變更」後才會上傳並同步前台。</p><div class="actions"><button class="primary" id="save">儲存全部變更</button><button class="secondary" id="removeAll">移除全部菜單</button></div><div class="status" id="status" aria-live="polite">${notice}</div></section></section>`;
        const list=app.querySelector('.list');list.scrollTop=listScroll;
        list.querySelectorAll('.store').forEach(button=>button.onclick=()=>{if(saving)return;selectedId=button.dataset.id;render();});
        document.getElementById('menuFiles').onchange=event=>{
          const files=[...event.target.files];if(items.length+files.length>8){setStatus('每間店最多 8 張菜單圖片。',true);return;}
          let added=0;for(const file of files){if(file.size>10*1024*1024){setStatus(`「${file.name}」超過 10 MB，沒有加入。`,true);continue;}items.push({file,preview:URL.createObjectURL(file)});added++;}
          redraw();setStatus(added?`已加入 ${added} 張待儲存圖片。`:'沒有可加入的圖片。');event.target.value='';
        };
        document.getElementById('removeAll').onclick=()=>{if(confirm(`確定移除「${place.name}」的全部菜單圖片？`)){items.forEach(item=>item.preview&&URL.revokeObjectURL(item.preview));items=[];redraw();setStatus('已清空暫存，請按「儲存全部變更」完成同步。');}};
        document.getElementById('save').onclick=async()=>{
          if(saving)return;saving=true;const button=document.getElementById('save'),editor=document.getElementById('editor');button.disabled=true;editor.classList.add('busy');setStatus('正在逐張上傳，請勿切換店家…');
          try{
            const urls=[];for(const item of items)urls.push(item.file?await backend.uploadMenuImage(item.file,place.id):item.url);
            const changed={...place,menuImages:urls,menu:urls[0]||'',menuText:''};const saved=await backend.savePlace(changed);
            const index=places.findIndex(store=>store.id===saved.id);if(index>=0)places[index]=saved;items.forEach(item=>item.preview&&URL.revokeObjectURL(item.preview));
            const link='place.html?name='+encodeURIComponent(saved.name);saving=false;render(`已成功儲存 ${urls.length} 張菜單，前台已同步。`);
            const status=document.getElementById('status'),verify=document.createElement('a');verify.href=link;verify.target='_blank';verify.rel='noopener';verify.textContent=' 開啟公開店家頁確認 →';status.append(verify);
          }catch(error){saving=false;button.disabled=false;editor.classList.remove('busy');setStatus('儲存失敗：'+(error.message||'請稍後再試。你的原始圖片仍保留在目前頁面，可直接重試。'),true);}
        };
        redraw();
      };
      render();
    }
  </script>
</body>
</html>
