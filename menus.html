<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菜單管理｜校邊好去處</title><style>:root{--ink:#1f2933;--muted:#667085;--paper:#fffdf8;--line:#e8e2d7;--brand:#176b5b;--soft:#f3f7f4;--danger:#b93815}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,"Noto Sans TC",sans-serif}.shell{max-width:1040px;margin:auto;padding:0 28px}nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:20px;font-weight:800}.logo b,a{color:var(--brand)}a{font-weight:700;text-decoration:none}.head{padding:40px 0 24px}.head h1{font-size:34px;margin:0 0 7px}.head p,.sub,.hint{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:.82fr 1.18fr;gap:24px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:21px}.panel h2{font-size:19px;margin:0 0 5px}.sub{margin-bottom:16px;font-size:14px}.list{display:grid;gap:9px}.store{width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;cursor:pointer;font:inherit}.store.active,.store:hover{border-color:var(--brand);background:var(--soft)}.store strong{display:block}.store small{color:var(--muted)}label{display:grid;gap:7px;font-weight:700}input{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:9px}.preview{min-height:220px;border:1px dashed var(--line);border-radius:10px;margin:14px 0;background:var(--soft);display:grid;place-items:center;color:var(--muted);overflow:auto}.preview img{display:block;max-width:100%;max-height:440px}.actions{display:flex;gap:10px}.primary,.secondary{font:inherit;font-weight:800;border-radius:8px;padding:10px 14px;cursor:pointer}.primary{border:0;background:var(--brand);color:#fff}.primary:disabled{opacity:.6}.secondary{border:1px solid var(--line);background:#fff;color:var(--danger)}.status{min-height:24px;color:var(--brand);margin-top:12px;font-size:14px}.error{color:var(--danger)}@media(max-width:760px){.shell{padding:0 18px}.layout{grid-template-columns:1fr}}</style></head><body><nav class="shell"><div class="logo">校邊<b>好去處</b> <small>管理後台</small></div><a href="admin.html">← 返回店家管理</a></nav><main class="shell" id="app"><section class="head"><h1>菜單管理</h1><p>正在確認管理權限…</p></section></main><script src="supabase-config.js"></script><script type="module" src="backend.js"></script><script type="module">const app=document.getElementById('app'),wait=async()=>{for(let i=0;i<50&&!window.CampusBackend;i++)await new Promise(r=>setTimeout(r,50));return window.CampusBackend},esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const backend=await wait();const login=note=>{app.innerHTML=`<section class="head"><h1>菜單管理登入</h1><p>${esc(note||'請使用管理員帳號登入。')}</p></section><form class="panel" id="login" style="max-width:440px;display:grid;gap:13px"><label>電子信箱<input id="email" type="email" required></label><label>密碼<input id="password" type="password" required></label><button class="primary">登入</button><span class="status" id="loginStatus"></span></form>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();const out=document.getElementById('loginStatus');try{await backend.signIn(document.getElementById('email').value,document.getElementById('password').value);if(!await backend.isAdmin())throw Error('此帳號沒有管理權限。');location.reload()}catch(x){out.textContent=x.message||'無法登入。';out.className='status error'}}};if(!backend?.enabled)login('雲端後台尚未完成設定。');else if(!await backend.session()||!await backend.isAdmin())login();else{let places=await backend.getPlaces(),selected=0,pending='';const render=(notice='')=>{const p=places[selected];app.innerHTML=`<section class="head"><h1>菜單管理</h1><p>上傳清楚的菜單圖片；公開前台只能閱讀與放大。</p></section><section class="layout"><section class="panel"><h2>選擇店家</h2><p class="sub">共 ${places.length} 間店家</p><div class="list">${places.map((x,i)=>`<button class="store ${i===selected?'active':''}" data-index="${i}"><strong>${esc(x.name)}</strong><small>${x.menu?'已有菜單檔案':'尚未上傳菜單'}</small></button>`).join('')}</div></section><section class="panel"><h2>${esc(p.name)} 的菜單</h2><p class="sub">支援 JPG、PNG、WebP；檔案請小於 3 MB。</p><label>上傳菜單圖片<input id="menuFile" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="preview" id="preview">${p.menu?'<img src="'+p.menu+'" alt="現有菜單">':'尚未上傳菜單'}</div><p class="hint">選檔後按儲存，成功後會提供前台確認連結。</p><div class="actions"><button class="primary" id="save">儲存菜單</button><button class="secondary" id="remove">移除菜單</button></div><div class="status" id="status">${notice}</div></section></section>`;document.querySelectorAll('.store').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.index);pending='';render()});const file=document.getElementById('menuFile'),preview=document.getElementById('preview'),save=document.getElementById('save'),remove=document.getElementById('remove'),status=document.getElementById('status');file.onchange=e=>{const chosen=e.target.files[0];if(!chosen)return;if(chosen.size>3*1024*1024){status.textContent='菜單檔案請小於 3 MB。';status.className='status error';file.value='';return}const reader=new FileReader();reader.onload=()=>{pending=reader.result;preview.innerHTML='<img src="'+pending+'" alt="待儲存的菜單">';status.textContent='已載入預覽，請按「儲存菜單」。';status.className='status'};reader.onerror=()=>{status.textContent='無法讀取這個檔案。';status.className='status error'};reader.readAsDataURL(chosen)};save.onclick=async()=>{if(!pending){status.textContent='請先選擇要上傳的菜單檔案。';status.className='status error';return}save.disabled=true;status.textContent='正在儲存並同步前台…';status.className='status';try{p.menu=pending;p.menuText='';await backend.syncPlaces(places);pending='';const link='place.html?name='+encodeURIComponent(p.name);render(`已儲存成功，前台已同步。<a href="${link}" target="_blank">開啟公開店家頁確認 →</a>`)}catch(x){status.textContent='儲存失敗：'+(x.message||'請稍後再試');status.className='status error';save.disabled=false}};remove.onclick=async()=>{if(!confirm('確定移除這間店的菜單？'))return;try{p.menu='';p.menuText='';await backend.syncPlaces(places);render('已移除菜單並同步前台。')}catch(x){status.textContent='移除失敗：'+(x.message||'請稍後再試');status.className='status error'}}};render()}</script></body></html>
