<!doctype html>
<html lang="zh-Hant" class="backend-guard"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待審核店家｜校邊好去處</title><style>
html.backend-guard{visibility:hidden}:root{--ink:#1f2933;--muted:#667085;--paper:#fffdf8;--line:#e8e2d7;--brand:#176b5b;--soft:#f7f4ec}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 ui-sans-serif,system-ui,"Noto Sans TC",Arial,sans-serif}.shell{max-width:1080px;margin:auto;padding:0 28px}nav{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-weight:800;font-size:20px}.logo b,a{color:var(--brand)}a{font-weight:700;text-decoration:none}.head{padding:38px 0 20px}.head h1{font-size:32px;letter-spacing:-1px;margin:0}.head p,.meta{color:var(--muted)}.head p{margin:5px 0 0}.note{padding:13px 16px;background:#eaf6ef;border-radius:11px;color:#176b5b;margin:0 0 22px}.toolbar{display:flex;justify-content:space-between;gap:14px;margin-bottom:15px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.card h2{font-size:18px;margin:0}.meta{font-size:14px;margin:4px 0 12px}.detail{font-size:14px;margin:6px 0;color:#40505d}.detail b{color:var(--ink)}.tags,.actions{display:flex;flex-wrap:wrap;gap:8px}.tag{font-size:12px;background:var(--soft);padding:4px 7px;border-radius:5px}.actions{margin-top:17px}.action{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.add{background:var(--brand);color:#fff;border-color:var(--brand)}.skip{color:#8c3d20}.empty{grid-column:1/-1;text-align:center;padding:44px;background:var(--soft);border-radius:14px;color:var(--muted)}@media(max-width:700px){.shell{padding:0 18px}.cards{grid-template-columns:1fr}.toolbar{flex-direction:column}}
</style></head><body><nav class="shell"><div class="logo">校邊<b>好去處</b></div><a href="admin.html">← 回管理後台</a></nav><main class="shell"><section class="head"><h1>待審核店家</h1><p>特約店家資料已匯入雲端；審核完成後才會顯示在公開網站。</p></section><div class="note">請核對店名、座標、優惠與營業時間。按「加入網站」後，仍可在店家資料頁補齊照片、標籤與菜單。</div><div class="toolbar"><span id="count">正在讀取待審核資料…</span><span id="status" role="status"></span></div><section class="cards" id="cards"></section></main><script src="supabase-config.js"></script><script type="module">
await import('./admin-guard.js');await import('./backend.js');
const backend=window.CampusBackend,cards=document.getElementById('cards'),count=document.getElementById('count'),status=document.getElementById('status');let candidates=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const render=()=>{count.textContent=`尚有 ${candidates.length} 間待審核店家`;cards.innerHTML=candidates.length?candidates.map(c=>`<article class="card"><h2>${esc(c.name)}</h2><div class="meta">${esc(c.category||'待分類')}・${esc(c.address||'地址待確認')}</div><div class="tags"><span class="tag">已提供座標</span><span class="tag">${esc(c.source||'候選資料')}</span></div><p class="detail"><b>營業時間：</b>${esc(c.hours||'待確認')}</p><p class="detail"><b>特約優惠：</b>${esc(c.benefit||'待確認')}</p>${c.notes?'<p class="detail"><b>備註：</b>'+esc(c.notes)+'</p>':''}<div class="actions"><button class="action add" data-add="${c.id}">加入網站</button><button class="action skip" data-skip="${c.id}">略過</button></div></article>`).join(''):'<div class="empty">本批待審核店家已處理完成。</div>';cards.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>promote(b.dataset.add));cards.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>remove(b.dataset.skip,'已略過這間店家。'));};
const remove=async(id,message)=>{try{status.textContent='儲存中…';await backend.removeCandidate(id);candidates=candidates.filter(c=>c.id!==id);render();status.textContent=message;}catch(error){status.textContent='操作失敗：'+error.message;}};
const promote=async id=>{const c=candidates.find(x=>x.id===id);if(!c)return;try{status.textContent='正在加入公開店家…';const place={id:crypto.randomUUID(),createdAt:new Date().toISOString(),name:c.name,icon:'📍',tone:'tone-1',price:'待確認',lat:c.lat,lng:c.lng,tags:[c.category].filter(Boolean),periods:[],days:[],hours:c.hours||'營業時間待確認',desc:c.benefit?`學生會特約優惠：${c.benefit}`:'由特約店家資料匯入，等待補充資訊。',updated:'剛剛',address:c.address,notes:c.notes||'',validUntil:c.validUntil||''};await backend.savePlace(place);await backend.removeCandidate(id);candidates=candidates.filter(x=>x.id!==id);render();status.textContent='已加入網站，前台重新整理後會看到這間店家。';}catch(error){status.textContent='加入失敗：'+error.message;}};
try{candidates=await backend.getCandidates();render();}catch(error){count.textContent='無法讀取待審核店家';status.textContent=error.message;}
</script></body></html>
