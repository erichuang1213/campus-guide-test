<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>店家資訊｜校邊好去處</title>
    <style>
      :root {
        --ink: #1f2933;
        --muted: #667085;
        --paper: #fffdf8;
        --line: #e8e2d7;
        --brand: #176b5b;
        --soft: #f3f6f2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.6 system-ui,
          "Noto Sans TC",
          sans-serif;
      }
      .shell {
        max-width: 920px;
        margin: auto;
        padding: 0 24px;
      }
      nav {
        height: 80px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
      }
      a {
        color: var(--brand);
        font-weight: 700;
        text-decoration: none;
      }
      .logo {
        font-size: 20px;
        font-weight: 800;
      }
      .logo b {
        color: var(--brand);
      }
      main {
        padding: 40px 0 65px;
      }
      .back {
        display: inline-block;
        margin-bottom: 24px;
      }
      .head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .head h1 {
        margin: 0;
        font-size: 35px;
      }
      .meta,
      .empty {
        color: var(--muted);
      }
      .state,
      .tag {
        background: #e3f2e9;
        color: var(--brand);
        border-radius: 7px;
        padding: 4px 8px;
        font-weight: 700;
        font-size: 13px;
        height: max-content;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin: 16px 0 24px;
      }
      .tag {
        background: var(--soft);
        color: var(--ink);
        font-weight: 400;
      }
      .section {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 17px;
        padding: 24px;
        margin-top: 16px;
      }
      .section h2 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      .section p {
        white-space: pre-wrap;
        margin: 0;
      }
      .text-menu {
        background: var(--soft);
        border-radius: 10px;
        padding: 14px;
        font-family: ui-monospace, "Noto Sans TC", monospace;
        line-height: 1.9;
      }
      .tools {
        display: flex;
        gap: 8px;
        margin: 12px 0;
      }
      .tools button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--brand);
        padding: 7px 11px;
        font: inherit;
        font-weight: 700;
      }
      .frame {
        max-height: 72vh;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .frame img {
        display: block;
        width: 100%;
        max-width: none;
        height: auto;
      }
      .menu-pages { display:flex; flex-wrap:wrap; gap:8px; margin:13px 0 2px; }
      .menu-pages button { border:1px solid var(--line); background:#fff; color:var(--brand); border-radius:999px; padding:7px 11px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
      .menu-pages button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
      .loading {
        padding: 50px;
        text-align: center;
        color: var(--muted);
      }
      @media (max-width: 600px) {
        .shell {
          padding: 0 18px;
        }
        .head h1 {
          font-size: 29px;
        }
        .section {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="shell">
      <div class="logo">校邊<b>好去處</b></div>
      <a href="index.html">← 返回找店</a>
    </nav>
    <main class="shell" id="app"><p class="loading">正在讀取店家資訊…</p></main>
    <script src="supabase-config.js"></script>
    <script type="module" src="backend.js"></script>
    <script type="module">
      const app = document.getElementById("app"),
        name = new URLSearchParams(location.search).get("name") || "",
        escape = (v) =>
          String(v || "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          ),
        valid = (v) =>
          /^data:image\//.test(v || "") || /^https?:\/\//.test(v || "");
      const open = (p) => {
        const n = new Date(),
          day = n.getDay(),
          now = n.getHours() * 60 + n.getMinutes(),
          slots = p.days?.includes(day) ? p.periods || [] : [];
        return slots.some((x) => {
          const m = (t) => t.split(":").reduce((a, b) => a * 60 + Number(b), 0);
          return now >= m(x.open) && now < m(x.close);
        })
          ? "營業中"
          : "今日休息";
      };
      const draw = (p) => {
        if (!p) {
          app.innerHTML = '<p class="loading">找不到這間店家。</p>';
          return;
        }
        document.title = p.name + "｜校邊好去處";
        const text = p.menuText?.trim();
        const images = [...new Set([
          ...(Array.isArray(p.menuImages) ? p.menuImages : []),
          p.menu,
        ].map(valid).filter(Boolean))];
        const image = images[0];
        const menu = text
          ? `<section class="section"><h2>店家菜單</h2><div class="text-menu">${escape(text)}</div><p class="empty" style="margin-top:10px;font-size:13px">菜單由管理者整理，出發前建議再次確認。</p></section>`
          : image
            ? `<section class="section"><h2>店家菜單</h2><p class="empty" style="margin-top:-8px">共 ${images.length} 張菜單圖片，點選下方頁碼切換。</p><div class="menu-pages">${images.map((_, i) => `<button class="${i === 0 ? 'active' : ''}" data-menu-page="${i}">第 ${i + 1} 張</button>`).join('')}</div><div class="tools"><button data-z="-">縮小</button><button data-z="0">適合閱讀區</button><button data-z="+">放大</button></div><div class="frame"><img id="menuImage" src="${image}" alt="${escape(p.name)} 的菜單，第 1 張"></div></section>`
            : '<section class="section"><h2>店家菜單</h2><p class="empty">店家尚未提供菜單。</p></section>';
        app.innerHTML = `<a class="back" href="index.html">← 返回找店</a><div class="head"><div><h1>${escape(p.name)}</h1><p class="meta">${escape(p.hours || "營業時間待確認")}・${escape(p.price || "價位待確認")}</p></div><span class="state">${open(p)}</span></div><div class="tags">${(p.tags || []).map((x) => `<span class="tag">${escape(x)}</span>`).join("")}</div><section class="section"><h2>近期資訊</h2><p>${escape(p.desc || "尚未補充學生提醒。")}</p></section>${menu}<section class="section"><h2>資訊更新</h2><p>若資訊有誤，歡迎到 <a href="submit-feedback.html">提交回饋</a> 告訴我們。</p></section>`;
        if (image && !text) {
          let z = 1,
            img = document.getElementById("menuImage");
          document.querySelectorAll("[data-menu-page]").forEach((button) => (button.onclick = () => {
            document.querySelectorAll("[data-menu-page]").forEach((item) => item.classList.toggle("active", item === button));
            img.src = images[Number(button.dataset.menuPage)];
            img.alt = `${p.name} 的菜單，第 ${Number(button.dataset.menuPage) + 1} 張`;
            z = 1;
            img.style.width = "100%";
          }));
          document.querySelectorAll("[data-z]").forEach(
            (b) =>
              (b.onclick = () => {
                z =
                  b.dataset.z === "+"
                    ? Math.min(2.5, z + 0.25)
                    : b.dataset.z === "-"
                      ? Math.max(0.6, z - 0.25)
                      : 1;
                img.style.width = Math.round(z * 100) + "%";
              }),
          );
        }
      };
      let places = [];
      try {
        places =
          (await (await fetch("./campus-guide-public-data.json")).json())
            .places || [];
        draw(places.find((p) => p.name === name));
      } catch (_) {}
      for (let i = 0; i < 50 && !window.CampusBackend; i++)
        await new Promise((r) => setTimeout(r, 50));
      try {
        const cloud = await window.CampusBackend?.getPlaces();
        if (cloud?.length) places = cloud;
      } catch (_) {}
      draw(places.find((p) => p.name === name));
    </script>
  </body>
</html>
