<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店家近期資訊｜校邊好去處</title><style>:root{--ink:#1f2933;--muted:#667085;--paper:#fffdf8;--line:#e8e2d7;--brand:#176b5b;--soft:#f3f6f2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 ui-sans-serif,system-ui,"Noto Sans TC",Arial}.shell{max-width:920px;margin:auto;padding:0 24px}nav{height:80px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.logo{font-size:20px;font-weight:800}.logo b{color:var(--brand)}a{color:var(--brand);font-weight:700;text-decoration:none}.page{padding:42px 0 65px}.back{display:inline-block;margin-bottom:25px}.head{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:start}.head h1{margin:0;font-size:35px;letter-spacing:-1px}.state{color:var(--brand);background:#e3f2e9;border-radius:7px;padding:4px 8px;font-weight:700;font-size:13px}.meta{color:var(--muted);margin:6px 0 17px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 25px}.tag{background:var(--soft);border-radius:6px;padding:4px 8px;font-size:13px}.section{background:#fff;border:1px solid var(--line);border-radius:17px;padding:24px;margin-top:16px}.section h2{font-size:20px;margin:0 0 8px}.section p{margin:0;color:#4d5761;white-space:pre-wrap}.menu-tools{display:flex;gap:8px;margin:12px 0}.menu-tools button{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--brand);padding:7px 11px;font:inherit;font-weight:700;cursor:pointer}.menu-frame{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fafafa}.menu-frame img{display:block;width:100%;max-width:none;height:auto;transform-origin:top left}.empty{color:var(--muted)!important}.loading{padding:55px 0;text-align:center;color:var(--muted)}@media(max-width:600px){.shell{padding:0 18px}.page{padding-top:28px}.head h1{font-size:29px}.section{padding:18px}}</style></head><body><nav class="shell"><div class="logo">校邊<b>好去處</b></div><a href="index.html">← 返回找店</a></nav><main class="shell page" id="app"><p class="loading">正在讀取店家資訊…</p></main><script src="supabase-config.js"></script><script type="module" src="backend.js"></script><script type="module">const app=document.getElementById('app'),name=new URLSearchParams(location.search).get('name')||'';const escape=value=>String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));const validMenu=value=>/^data:image\//.test(value||'')||/^https?:\/\//.test(value||'');const minutes=value=>value?.split(':').reduce((total,part)=>total*60+Number(part),0);const isOpen=place=>{const now=new Date(),day=now.getDay(),current=now.getHours()*60+now.getMinutes(),slots=(place.weeklySchedules||[]).filter(rule=>rule.days?.includes(day)).flatMap(rule=>rule.periods||[]);const active=slots.length?slots:(place.days?.includes(day)?place.periods||[]:[]);if(!active.length)return '今日休息';return active.some(slot=>current>=minutes(slot.open)&&current<minutes(slot.close))?'營業中':'休息中'};const render=place=>{if(!place){app.innerHTML='<p class="loading">找不到這間店家，可能資料已更新。</p>';return}document.title=`${place.name}｜校邊好去處`;const menu=validMenu(place.menu),image=menu?`<div class="section"><h2>店家菜單</h2><p style="margin-bottom:10px">以原始比例顯示，可捲動與放大閱讀。</p><div class="menu-tools"><button data-zoom="-">縮小</button><button data-zoom="reset">適合閱讀區</button><button data-zoom="+">放大</button></div><div class="menu-frame"><img id="menuImage" src="${place.menu}" alt="${escape(place.name)} 的菜單"></div></div>`:'<div class="section"><h2>店家菜單</h2><p class="empty">店家尚未提供菜單。若你有清楚的菜單照片，可從「提交回饋」推薦給管理者。</p></div>';app.innerHTML=`<a class="back" href="index.html">← 返回找店</a><div class="head"><div><h1>${escape(place.name)}</h1><p class="meta">${escape(place.hours||'營業時間待確認')}・${escape(place.price||'價位待確認')}</p></div><span class="state">${isOpen(place)}</span></div><div class="tags">${(place.tags||[]).map(tag=>`<span class="tag">${escape(tag)}</span>`).join('')}</div><div class="section"><h2>近期資訊</h2><p>${escape(place.desc||'尚未補充學生提醒。')}</p></div>${image}<div class="section"><h2>資訊更新</h2><p>最後確認：${escape(place.updated||'待確認')}。若資訊有誤，歡迎到 <a href="submit-feedback.html">提交回饋</a> 告訴我們。</p></div>`;if(menu){let scale=1;const image=document.getElementById('menuImage');document.querySelectorAll('[data-zoom]').forEach(button=>button.onclick=()=>{scale=button.dataset.zoom==='+'?Math.min(2.5,scale+.25):button.dataset.zoom==='-'?Math.max(.6,scale-.25):1;image.style.width=`${Math.round(scale*100)}%`})}};const load=async()=>{let places=[];try{const response=await fetch('./campus-guide-public-data.json',{cache:'no-store'});const snapshot=await response.json();places=snapshot.places||[]}catch(_){}for(let i=0;i<50&&!window.CampusBackend;i++)await new Promise(resolve=>setTimeout(resolve,50));try{const remote=await window.CampusBackend?.getPlaces();if(remote?.length)places=remote}catch(_){}render(places.find(place=>place.name===name))};load();</script></body></html>
