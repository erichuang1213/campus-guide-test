<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>提交回饋｜校邊好去處</title>
  <style>
    :root{--ink:#1f2933;--muted:#667085;--paper:#fffdf8;--line:#e8e2d7;--brand:#176b5b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 ui-sans-serif,system-ui,"Noto Sans TC",Arial}.shell{max-width:760px;margin:auto;padding:0 24px}nav{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:20px;font-weight:800}.logo b,a,.status{color:var(--brand)}a{font-weight:700;text-decoration:none}.intro{padding:54px 0 26px}.intro h1{font-size:34px;letter-spacing:-1px;margin:0 0 8px}.intro p,.hint{margin:0;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;margin-bottom:50px}label{display:grid;gap:7px;font-weight:700;margin-bottom:18px}select,textarea,input{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}textarea{min-height:150px;resize:vertical}.hint{font-size:13px;margin:-8px 0 18px}.submit{border:0;border-radius:9px;background:var(--brand);color:#fff;padding:12px 17px;font:inherit;font-weight:800;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.status{display:block;min-height:24px;margin-top:13px}@media(max-width:600px){.shell{padding:0 18px}.intro{padding-top:36px}.intro h1{font-size:30px}}
  </style>
</head>
<body>
  <nav class="shell"><div class="logo">校邊<b>好去處</b></div><a href="index.html">← 返回找店</a></nav>
  <main class="shell">
    <section class="intro"><h1>幫我們把校邊資訊做得更好</h1><p>回報資料錯誤、推薦新店家，或提出功能建議；這些訊息只會送到管理後台。</p></section>
    <form class="panel" id="feedbackForm">
      <label>回饋類型
        <select id="feedbackType" onchange="updateFeedbackType(this)">
          <option data-prompt="請說明哪間店、哪項資訊需要更正，例如營業時間已改為只外帶。">回報店家資訊有誤</option>
          <option data-prompt="推薦一家你希望收錄的店家；可填店名、地點、特色與你知道的營業資訊。">推薦新增店家</option>
          <option data-prompt="覺得網站哪裡還不夠完善？歡迎告訴我們你的想法。">提出功能建議</option>
          <option data-prompt="想跟我們說什麼都可以，謝謝你的意見。">其他回饋</option>
        </select>
      </label>
      <label>內容<textarea id="feedbackText" required placeholder="請說明哪間店、哪項資訊需要更正，例如營業時間已改為只外帶。"></textarea></label>
      <div id="menuField" hidden>
        <label>推薦店家的菜單圖片（選填，限 3 MB）<input id="feedbackMenuFile" type="file" accept="image/*"></label>
        <p class="hint">只在推薦新店家時需要；圖片只供管理者核對，不會公開顯示。</p>
      </div>
      <button class="submit" id="submit">送出回饋</button><span class="status" id="status" aria-live="polite"></span>
    </form>
  </main>
  <script>
    function updateFeedbackType(select){
      document.getElementById('feedbackText').placeholder=select.selectedOptions[0].dataset.prompt;
      document.getElementById('menuField').hidden=select.value!=='推薦新增店家';
    }
  </script>
  <script src="supabase-config.js"></script><script type="module" src="backend.js?v=feedback-identity-1"></script>
  <script type="module">
    const wait=async()=>{for(let i=0;i<50&&!window.CampusBackend;i++)await new Promise(r=>setTimeout(r,50));return window.CampusBackend};
    const backend=await wait(),form=document.getElementById('feedbackForm'),status=document.getElementById('status'),submit=document.getElementById('submit');
    const session=await backend?.session();
    if(session)status.textContent=`已登入：${session.user.user_metadata?.full_name||session.user.email}。這次回饋會顯示給管理者。`;
    else status.textContent='目前以匿名方式回饋；登入後可讓管理者辨識你的回報。';
    const read=file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});
    form.onsubmit=async event=>{
      event.preventDefault();
      const body=document.getElementById('feedbackText').value.trim(),file=document.getElementById('feedbackMenuFile').files[0];
      if(!body)return;
      if(file&&file.size>3*1024*1024){status.textContent='菜單圖片請小於 3 MB。';return}
      submit.disabled=true;status.textContent='正在送出回饋…';
      try{
        const entry={type:document.getElementById('feedbackType').value,text:body,menuImage:file?await read(file):'',menuFileName:file?.name||''};
        if(backend?.enabled)await backend.submitFeedback(entry);
        else{const local=JSON.parse(localStorage.getItem('campusGuideFeedback')||'[]');local.unshift({...entry,createdAt:new Date().toLocaleString('zh-TW')});localStorage.setItem('campusGuideFeedback',JSON.stringify(local))}
        form.reset();updateFeedbackType(document.getElementById('feedbackType'));status.textContent='已收到你的回饋，謝謝你幫忙讓資訊更可靠。';
      }catch(error){status.textContent=`目前無法送出：${error.message||'請稍後再試。'}`}finally{submit.disabled=false}
    };
    const placeName=new URLSearchParams(location.search).get('place');
    if(placeName){
      document.getElementById('feedbackText').value=`店家：${placeName}\n狀況：`;
      document.getElementById('feedbackText').focus();
    }
  </script>
</body></html>
